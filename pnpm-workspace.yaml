packages:
  - "apps/*"
  - "packages/*"
packageExtensions:
  # nestjs-i18n requires typescript to generate the translation key types but
  # does not declare it, so it resolved the hoisted TypeScript 7, which has no
  # compiler API. As a peer it gets the consumer's TypeScript 6 (apps/api).
  nestjs-i18n:
    peerDependencies:
      typescript: "*"
allowBuilds:
  # Download the engines the Prisma CLI needs (migrate, generate).
  '@prisma/engines': true
  argon2: false
  prisma: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10
